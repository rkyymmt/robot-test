; ATOM Lite / ATOM Matrix + ATOM Mate for toio 用
; 使い方: firmware/ で `pio run -t upload && pio device monitor`
[platformio]
src_dir = atom_toio_bridge

[env:atom]
; Arduino core 2.0.x 系 (M5StackToio が要求する NimBLE-Arduino 1.4.x と組み合わせる)
platform = espressif32@6.13.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; BLE + Wi-Fi + (TLS) でデフォルトの 1.3MB を超えるため、アプリ領域を広げる
board_build.partitions = huge_app.csv
lib_deps =
    kenichi884/M5StackToio@1.0.5
    h2zero/NimBLE-Arduino@1.4.3
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit_VL53L0X@^1.2.5
