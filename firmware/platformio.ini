; ATOM Mate for toio 用ファームウェア
; 使い方 (firmware/ で実行):
;   AtomS3 / AtomS3 Lite    : pio run -t upload && pio device monitor
;   ATOM Lite / ATOM Matrix : pio run -e atom -t upload && pio device monitor -e atom
[platformio]
src_dir = atom_toio_bridge
default_envs = atoms3

[env]
; Arduino core 2.0.x 系 (M5StackToio が要求する NimBLE-Arduino 1.4.x と組み合わせる)
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps =
    kenichi884/M5StackToio@1.0.5
    h2zero/NimBLE-Arduino@1.4.3
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit_VL53L0X@^1.2.5

[env:atoms3]
; AtomS3 / AtomS3 Lite (ESP32-S3, フラッシュ 8MB)
board = m5stack-atoms3
; Serial を USB (Type-C) に出す
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:atom]
; ATOM Lite / ATOM Matrix (ESP32, フラッシュ 4MB)
board = m5stack-atom
; BLE + Wi-Fi + TLS でデフォルトのアプリ領域 1.3MB に収まらないことがあるため広げる
board_build.partitions = huge_app.csv
